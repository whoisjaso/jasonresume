const q = new URLSearchParams(location.search);

{ let a = +(q.get("seed") || 1) >>> 0; Math.random = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// floor with a 0.5 m grid, and a chair

const chair = new THREE.Group(); const cm = new THREE.MeshBasicMaterial({ color: "#5a4a3a" });

bx(0.5, 0.06, 0.5, 0, 0.46, 0); bx(0.5, 0.5, 0.06, 0, 0.74, -0.24); bx(0.06, 0.44, 0.06, 0, 0.22, 0); chair.visible = false; scene.add(chair);

// a car to get into and drive: ?car=sedan (assets/story/world/car-<kind>-v2.glb) as a stand-in for story/vehicle.js,
// with the same parts and calls (tools/story/HANDOFF-drive.md): body, seat, steeringWheel, doors, speed, steerAngle

      handle(s) { return dn(s).localToWorld(new V3(sxOf(s) * 0.03, 0.36, -1.08)); },

  box("#4a3a2c", 0.9, 0.04, 0.6, 0.0, 0.73, 3.0); box("#4a3a2c", 0.6, 0.04, 0.5, 1.4, 0.73, 1.0);

  const book = new THREE.Group(); scene.add(book); book.position.set(-0.18, 0.75, 2.8); book.rotation.y = 0.3;

  else if (camMode === "face") { const h = p.headWorld(new THREE.Vector3()); camera.position.set(h.x + Math.sin(p.yaw) * 0.75 + 0.15, h.y - 0.02, h.z + Math.cos(p.yaw) * 0.75); camera.lookAt(h.x, h.y - 0.05, h.z); }

    const b = p.bones[camMode === "hand" ? "hand_r" : "hand_l"], h = b.getWorldPosition(new THREE.Vector3()), sd = camMode === "hand" ? -1 : 1, y = p.yaw;
    const d = +(q.get("cd") || 0.75);
    camera.position.set(h.x + Math.cos(y) * sd * d + Math.sin(y) * d * 0.35, h.y + 0.12, h.z - Math.sin(y) * sd * d + Math.cos(y) * d * 0.35); camera.lookAt(h);

  else if (camMode === "armr") { const y = p.yaw; camera.position.set(c.x + Math.sin(y - 0.9) * 2.4, 1.3, c.z + Math.cos(y - 0.9) * 2.4); camera.lookAt(c.x, 1.05, c.z); }
  else if (camMode === "car") { const o = CAR ? CAR.object.position : c; camera.position.set(o.x + 3.6, 1.45, o.z - 1.2); camera.lookAt(o.x + 0.7, 0.85, o.z - 0.2); }
  else if (camMode === "carin") { const o = CAR.object; const v = new THREE.Vector3(-0.15, 1.2, 1.05); o.localToWorld(v); camera.position.copy(v); camera.lookAt(o.localToWorld(new THREE.Vector3(0.42, 0.95, -0.05))); }

  else if (camMode === "carside") { const o = CAR.object; const v = new THREE.Vector3(2.4, 1.15, -0.05); o.localToWorld(v); camera.position.copy(v); camera.lookAt(o.localToWorld(new THREE.Vector3(0.4, 0.85, 0.1))); }
  else if (camMode === "ix") { const y = p.yaw + (+(q.get("ca") || 0.9)), d = +(q.get("cd") || 2.3); camera.position.set(c.x + Math.sin(y) * d, 1.35, c.z + Math.cos(y) * d); camera.lookAt(c.x, +(q.get("cy") || 0.9), c.z); }
  else if (camMode === "reachl" || camMode === "reachr") { const sd = camMode === "reachl" ? 1 : -1; camera.position.set(c.x + sd * 2.2, 1.15, c.z + 1.3); camera.lookAt(c.x + sd * 0.1, 0.85, c.z + 0.3); }
  else if (camMode === "reach") { camera.position.set(c.x - 1.0, 1.15, c.z + 2.4); camera.lookAt(c.x, 0.85, c.z + 0.2); }
  else if (camMode === "grid") { camera.position.set(0, 2.2, 7.5); camera.lookAt(0, 0.6, -1.2); }
  else if (camMode === "fixed") { const z = +(q.get("cz") || 4); camera.position.set(6, 1.3, z); camera.lookAt(0, 0.9, z); }
}
function step(dt) { T += dt; P.forEach((p, i) => { drive(p, i, dt); p.update(dt); }); if (refMix) refMix.update(dt); refMixers.forEach(m => m.update(dt)); }

const tick = () => new Promise(r => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); });

}

if (q.get("auto") !== "0") { let last = performance.now(); (function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); render(); requestAnimationFrame(loop); })(last); }
else { step(0); render(); }
window.LAB_READY = true;
