<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Cast lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1d1c; color: #ede7db; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 8px; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<div id="hud"></div>
<script type="module">
/* The cast lab: one or more people on a plain floor, driven the way the episode drives
   them (position, wantYaw, talk, lookAtP, pose, hold), for checking motion by eye and
   for recording frame strips. Dev tool, not shipped in the episode.
   ?who=jason,dell&run=walk|loop|stop|turn|talk|sit|jog&speed=1.45&cam=side|front|follow|face */
import * as THREE from "../../vendor/three-0.184.0/three.module.min.js";
import { loadCast, DEBUG } from "../../story/people.js";
import { GLTFLoader } from "../../vendor/three-0.184.0/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "../../vendor/meshopt-0.22.0/meshopt_decoder.module.js";
import { U } from "../../story/paint.js";
import { brush } from "../../story/tex.js";
const q = new URLSearchParams(location.search);
const who = (q.get("who") || "jason").split(",");
const W = +(q.get("w") || innerWidth), H = +(q.get("h") || innerHeight);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(+(q.get("pr") || 1)); renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#2a2f2d");
const camera = new THREE.PerspectiveCamera(+(q.get("fov") || 35), W / H, 0.05, 200);
U.uBrush.value = brush(); U.uSky.value.set("#8d9aa1"); U.uGround.value.set("#3a3530"); U.uMoon.value.set("#b9b2a2"); U.uMoonDir.value.set(0.4, 0.8, 0.6).normalize();
U.uFogDen.value = 0.002; U.uWetAll.value = 0.05; U.uRim.value.set("#9fb0bb");
U.uLampN.value = 1; U.uLampPos.value[0].set(1.5, 3.2, 2.5, 14); U.uLampCol.value[0].set(1.4, 1.2, 0.95, 0);
// floor with a 0.5 m grid, and a chair
const grid = new THREE.GridHelper(40, 80, "#555", "#3a3a3a"); scene.add(grid);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ color: "#26292a" })); floor.rotation.x = -Math.PI / 2; floor.position.y = -0.002; scene.add(floor);
const chair = new THREE.Group(); const cm = new THREE.MeshBasicMaterial({ color: "#5a4a3a" });
const bx = (w, h, d, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), cm); m.position.set(x, y, z); chair.add(m); };
bx(0.5, 0.06, 0.5, 0, 0.46, 0); bx(0.5, 0.5, 0.06, 0, 0.74, -0.24); bx(0.06, 0.44, 0.06, 0, 0.22, 0); chair.visible = false; scene.add(chair);

// a car to get into and drive: ?car=sedan (assets/story/world/car-<kind>-v2.glb) as a stand-in for story/vehicle.js,
// with the same parts and calls (tools/story/HANDOFF-drive.md): body, seat, steeringWheel, doors, speed, steerAngle
let CAR = null;
if (q.get("car")) {
  const ld = new GLTFLoader(); ld.setMeshoptDecoder(MeshoptDecoder);
  const g = await ld.loadAsync("../../assets/story/world/car-" + q.get("car") + "-v2.glb");
  const root = new THREE.Group(); root.add(g.scene); scene.add(root);
  const col = { paint: ["#4a5866", 0.3], glass: ["#9fb6c8", 0.12], interior: ["#2b2926", 1], seat: ["#3d3530", 1], dash: ["#1e1d1c", 1], tire: ["#111", 1], rim: ["#888", 1], chrome: ["#aaa", 1], trim: ["#222", 1], well: ["#151515", 1] };
  g.scene.traverse(o => { if (o.isMesh) { const nm = (o.material.name || "trim").replace(/\.\d+$/, ""), c = col[nm] || ["#444", 1]; o.material = new THREE.MeshBasicMaterial({ color: c[0], transparent: c[1] < 1, opacity: c[1], depthWrite: c[1] >= 1, side: THREE.DoubleSide }); o.frustumCulled = false; } });
  const body = g.scene.getObjectByName("body"), V3 = THREE.Vector3;
  const dn = s => body.getObjectByName(s === "passenger" ? "door_R" : "door_L"), sxOf = s => (s === "passenger" ? -1 : 1);
  CAR = { object: root, body, seat: body.getObjectByName("seat_D"), seatP: body.getObjectByName("seat_P"), steeringWheel: body.getObjectByName("steer"),
    speed: 0, steerAngle: 0, wheelAngle: 0, throttle: 0, brake: 0,
    doors: { t: { driver: 0, passenger: 0 }, node: dn, get(s) { return this.t[s] || 0; },
      open(s, t) { this.t[s] = t; dn(s).rotation.y = -sxOf(s) * t * 1.134; },
      handle(s) { return dn(s).localToWorld(new V3(sxOf(s) * 0.03, 0.36, -1.08)); },
      inner(s) { return dn(s).localToWorld(new V3(-sxOf(s) * 0.08, 0.27, -0.72)); } } };
  CAR.steeringWheel.userData.rimR = 0.185;
  // the handoff's wheel turns about its local Z with the rim in local XY; a model whose rim lies in XZ is stood up here
  // (?wheelfix=0 keeps the model as it is)
  { const W = CAR.steeringWheel, m = W.children.find(o => o.isMesh); if (m && q.get("wheelfix") !== "0") { m.geometry.computeBoundingBox(); const s = new THREE.Vector3(); m.geometry.boundingBox.getSize(s); if (s.y < s.z && s.y < s.x) { const pv = new THREE.Group(); pv.rotation.x = -Math.PI / 2; W.add(pv); pv.add(m); } } }
}
const cast = await loadCast("../../assets/story/cast/", { clips: q.get("clips") || undefined });
const P = [];
for (let i = 0; i < who.length; i++) { const p = await cast.make(who[i] + "-v1"); scene.add(p.group); p.pos.set((i - (who.length - 1) / 2) * 1.2, 0, 0); P.push(p); }
if (q.get("noik")) DEBUG.ik = false;
if (q.get("clav") != null) DEBUG.clav = +q.get("clav");
if (q.get("cdrop") != null) DEBUG.cdrop = +q.get("cdrop");
// a reference: the library's own mannequin playing the source clip, beside the first person
let refMix = null, refObj = null;
if (q.get("ref")) {
  const [file, clip] = q.get("ref").split(":");
  const g = await new GLTFLoader().loadAsync("/ref/" + file + ".glb");
  refObj = g.scene; scene.add(refObj); refObj.position.set(1.1, 0, 0);
  refObj.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshNormalMaterial(); o.frustumCulled = false; } });
  refMix = new THREE.AnimationMixer(refObj); refMix.clipAction(g.animations.find(a => a.name === clip)).play();
}
// a grid of the library's clips on its mannequin: ?refgrid=UAL1:Idle_Loop,Walk_Loop,...
const refMixers = [];
if (q.get("refgrid")) {
  const [file, list] = q.get("refgrid").split(":");
  const names = list.split(",");
  const g = await new GLTFLoader().loadAsync("/ref/" + file + ".glb");
  const { clone } = await import("../../vendor/three-0.184.0/addons/utils/SkeletonUtils.js");
  names.forEach((nm, i) => {
    const o = clone(g.scene); o.traverse(m => { if (m.isMesh) { m.material = new THREE.MeshNormalMaterial(); m.frustumCulled = false; } });
    o.position.set((i % 4) * 1.3 - 2, 0, -Math.floor(i / 4) * 1.6); scene.add(o);
    const mx = new THREE.AnimationMixer(o); const a = g.animations.find(a => a.name === nm); if (a) mx.clipAction(a).play(); refMixers.push(mx);
  });
  P.forEach(p => (p.group.visible = false));
}
// any clip, played straight on the first person: ?clip=name
if (q.get("clip")) { const c = cast.motion.clips[q.get("clip")]; if (c) { cast.motion.clips.idle = c; c.loop = true; } }
// a voice line's word timings driving the first person's mouth: ?words=<line id in assets/voice/story>
let WORDS = null; if (q.get("words")) WORDS = await (await fetch("../../assets/voice/" + (q.get("vdir") || "story-v3") + "/" + q.get("words") + ".json")).json();
const run = q.get("run") || "idle", speed = +(q.get("speed") || 1.45);
let T = 0; const REACH = {}, CARS = {};
// a scripted driver, deterministic in time
function drive(p, i, dt) {
  const t = T;
  if (run === "walk" || run === "jog") {
    // straight along +z then back, with a stop and a turn at each end
    const L = 8, v = run === "jog" ? +(q.get("speed") || 2.6) : speed;
    const seg = L / v, cyc = 2 * seg + 3.0, u = (t + i * 0.37) % cyc;
    let want = 0;
    if (u < seg) want = v; else if (u < seg + 1.5) want = 0; else if (u < 2 * seg + 1.5) want = v; else want = 0;
    const dir = u < seg + 0.6 ? 0 : (u < 2 * seg + 2.1 ? Math.PI : 0);
    p.wantYaw = dir;
    p.speed = damp(p.speed, want, 10, dt);
    const turn = Math.abs(ang(p.yaw, p.wantYaw));
    const sp = p.speed * (turn > 1.6 ? 0.25 : 1);
    p.pos.x += Math.sin(p.yaw) * sp * dt * 0 + Math.sin(p.wantYaw) * sp * dt; p.pos.z += Math.cos(p.wantYaw) * sp * dt;
  } else if (run === "loop") {
    // a circle of radius r, constant speed: leaning into the turn
    const r = +(q.get("r") || 3), v = speed, a = (t * v) / r;
    p.pos.set(Math.sin(a) * r, 0, Math.cos(a) * r - r); p.wantYaw = a + Math.PI / 2; p.speed = v;
  } else if (run === "turn") {
    // standing, turning to face points around it
    const k = Math.floor(t / 2.2), ys = [0, 1.6, 3.1, 1.2, -1.4, 0.4, 2.6]; p.wantYaw = ys[k % ys.length]; p.speed = 0;
  } else if (run === "talk") {
    p.talk = Math.sin(t * 7) > -0.3 && (t % 6) < 4.5 ? 1 : 0.15; if ((t % 6) > 4.5) p.talk = 0;
    p.lookAtP = new THREE.Vector3(Math.sin(t * 0.3) * 1.5, 1.6, 2);
  } else if (run === "car" && i === 0 && CAR) {
    // ?run=car&seq=enter|drive|exit: walk up, open the door, get in, close it, take the wheel; or drive (the wheel and
    // the car turning); or get out
    const seq = q.get("seq") || "enter";
    if (!CARS.started) {
      CARS.started = true;
      if (seq === "enter") { p.pos.set(2.6, 0, -2.6); p.yaw = p.wantYaw = 0; p.enterCar(CAR, "driver").then(() => (CARS.done = T)); }
      else { p.drive(CAR); if (seq === "exit") CARS.exitAt = 1.0; }
    }
    if (CARS.exitAt != null && t >= CARS.exitAt) { CARS.exitAt = null; p.exitCar(CAR).then(() => (CARS.done = T)); }
    if (seq === "drive") {
      // the wheel a full turn each way (hand over hand), the car on a gentle curve
      const w = +(q.get("wheel") || 0) || Math.sin(t * 0.55) * 4.2;
      CAR.wheelAngle = w; CAR.steerAngle = w / 14; { const W = CAR.steeringWheel; W.userData.q0 = W.userData.q0 || W.quaternion.clone(); const ax = W.userData.rimAxis || "z"; const a = new THREE.Vector3(); a[ax] = 1; W.quaternion.copy(W.userData.q0).multiply(new THREE.Quaternion().setFromAxisAngle(a, w)); } CAR.speed = 6; CAR.throttle = 0.4 + 0.3 * Math.sin(t);
      if (q.get("move")) { CARS.yaw = (CARS.yaw || 0) - CAR.steerAngle * 6 / 2.8 * dt; CAR.object.rotation.y = CARS.yaw; CAR.object.position.x += Math.sin(CARS.yaw) * 6 * dt; CAR.object.position.z += Math.cos(CARS.yaw) * 6 * dt; }
    }
  } else if (run === "reach" && i === 0) {
    // reaching for things: a door handle, a book on a shelf, keys on the floor; a red dot marks each contact point
    if (!REACH.made) {
      REACH.made = true;
      const mk = (c, w, h, d, x, y, z, o = 1) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color: c, transparent: o < 1, opacity: o, depthWrite: o >= 1 })); m.position.set(x, y, z); scene.add(m); return m; };
      mk("#3b3631", 0.9, 2.1, 0.05, 0.55, 1.05, 0.58, 0.35);                    // a door
      mk("#9a9a9a", 0.13, 0.022, 0.022, 0.3, 1.0, 0.53);                  // its handle (bar along x)
      mk("#4a3a2c", 0.6, 0.03, 0.3, -0.5, 1.42, 0.5, 0.6);                    // a shelf
      mk("#7a2e26", 0.035, 0.22, 0.16, -0.36, 1.545, 0.42);                  // a book standing on it
      mk("#c9a96a", 0.05, 0.012, 0.03, 0.16, 0.006, 0.42);                  // keys on the floor
      const dot = new THREE.MeshBasicMaterial({ color: "#ff2a2a", depthTest: false });
      REACH.pts = [ [new THREE.Vector3(0.3, 1.0, 0.53), "grip"], [new THREE.Vector3(-0.36, 1.6, 0.42), "pinch"], [new THREE.Vector3(0.16, 0.02, 0.42), "pinch"], [new THREE.Vector3(0.14, 1.3, 0.55), "press"] ];
      for (const [v] of REACH.pts) { const d = new THREE.Mesh(new THREE.SphereGeometry(0.008, 8, 6), dot); d.position.copy(v); d.renderOrder = 9; scene.add(d); }
      REACH.k = 0; REACH.next = 0.5;
    }
    // (the harness steps frames synchronously, so poll the reach rather than wait on its promise)
    const busy = p.reaches && (p.reaches.l || p.reaches.r);
    if (busy) REACH.next = t + 0.4;
    else if (t >= REACH.next) {
      const sel = q.get("pt") != null ? +q.get("pt") : REACH.k++ % REACH.pts.length;
      const [v, hold] = REACH.pts[sel];
      p.reachTo(v, { hold, contact: 0.6 });
    }
  } else if (run === "sit") { chair.visible = true; chair.position.set(p.pos.x, 0, p.pos.z); p.pose = (t % 8) < 6 ? "sit" : "stand"; }
  if (WORDS && i === 0) { const now = t % (WORDS.duration + 0.6); const w = WORDS.words.find(w => now >= w.s && now <= w.e); p.talk = w ? 1 : 0.15; p.speak(WORDS.words, now); }
  if (q.get("hold")) p.hold = q.get("hold");
  if (q.get("look")) p.lookAtP = new THREE.Vector3(0, 1.6, 3);
}
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
function ang(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
const camMode = q.get("cam") || "side";
function placeCam() {
  const p = P[0], c = p.pos;
  if (camMode === "side") { camera.position.set(c.x + 5.5, 1.0, c.z); camera.lookAt(c.x, 0.85, c.z); }
  else if (camMode === "chest") { camera.position.set(c.x + Math.sin(p.yaw) * 2.2, 1.35, c.z + Math.cos(p.yaw) * 2.2); camera.lookAt(c.x, 1.25, c.z); }
  else if (camMode === "front") { camera.position.set(c.x + 0.8, 1.2, c.z + 5); camera.lookAt(c.x, 0.9, c.z); }
  else if (camMode === "follow") { const y = p.yaw; camera.position.set(c.x - Math.sin(y) * 4 + 1.2, 1.7, c.z - Math.cos(y) * 4); camera.lookAt(c.x, 1.0, c.z); }
  else if (camMode === "feet") { camera.position.set(c.x + 2.2, 0.35, c.z + 0.4); camera.lookAt(c.x, 0.25, c.z); }
  else if (camMode === "face") { const h = p.headWorld(new THREE.Vector3()); camera.position.set(h.x + Math.sin(p.yaw) * 0.75 + 0.15, h.y - 0.02, h.z + Math.cos(p.yaw) * 0.75); camera.lookAt(h.x, h.y - 0.05, h.z); }
  else if (camMode === "hand" || camMode === "handl") {
    // close on a hand, from the body's side, so wrist angles and fingers read
    const b = p.bones[camMode === "hand" ? "hand_r" : "hand_l"], h = b.getWorldPosition(new THREE.Vector3()), sd = camMode === "hand" ? -1 : 1, y = p.yaw;
    const d = +(q.get("cd") || 0.75);
    camera.position.set(h.x + Math.cos(y) * sd * d + Math.sin(y) * d * 0.35, h.y + 0.12, h.z - Math.sin(y) * sd * d + Math.cos(y) * d * 0.35); camera.lookAt(h);
  }
  else if (camMode === "arm") { const y = p.yaw; camera.position.set(c.x + Math.sin(y + 0.9) * 2.4, 1.3, c.z + Math.cos(y + 0.9) * 2.4); camera.lookAt(c.x, 1.05, c.z); }
  else if (camMode === "armr") { const y = p.yaw; camera.position.set(c.x + Math.sin(y - 0.9) * 2.4, 1.3, c.z + Math.cos(y - 0.9) * 2.4); camera.lookAt(c.x, 1.05, c.z); }
  else if (camMode === "car") { const o = CAR ? CAR.object.position : c; camera.position.set(o.x + 3.6, 1.45, o.z - 1.2); camera.lookAt(o.x + 0.7, 0.85, o.z - 0.2); }
  else if (camMode === "carin") { const o = CAR.object; const v = new THREE.Vector3(-0.15, 1.2, 1.05); o.localToWorld(v); camera.position.copy(v); camera.lookAt(o.localToWorld(new THREE.Vector3(0.42, 0.95, -0.05))); }
  else if (camMode === "carpass") { const o = CAR.object; const v = new THREE.Vector3(-0.42, 1.12, -0.22); o.localToWorld(v); camera.position.copy(v); camera.lookAt(o.localToWorld(new THREE.Vector3(0.36, 0.98, 0.12))); }
  else if (camMode === "carside") { const o = CAR.object; const v = new THREE.Vector3(2.4, 1.15, -0.05); o.localToWorld(v); camera.position.copy(v); camera.lookAt(o.localToWorld(new THREE.Vector3(0.4, 0.85, 0.1))); }
  else if (camMode === "reachl" || camMode === "reachr") { const sd = camMode === "reachl" ? 1 : -1; camera.position.set(c.x + sd * 2.2, 1.15, c.z + 1.3); camera.lookAt(c.x + sd * 0.1, 0.85, c.z + 0.3); }
  else if (camMode === "reach") { camera.position.set(c.x - 1.0, 1.15, c.z + 2.4); camera.lookAt(c.x, 0.85, c.z + 0.2); }
  else if (camMode === "grid") { camera.position.set(0, 2.2, 7.5); camera.lookAt(0, 0.6, -1.2); }
  else if (camMode === "fixed") { const z = +(q.get("cz") || 4); camera.position.set(6, 1.3, z); camera.lookAt(0, 0.9, z); }
}
function step(dt) { T += dt; P.forEach((p, i) => { drive(p, i, dt); p.update(dt); }); if (refMix) refMix.update(dt); refMixers.forEach(m => m.update(dt)); }
function render() { placeCam(); U.uTime.value = T; renderer.render(scene, camera); hud.textContent = q.get("hud") === "0" ? "" : `${run}  t ${T.toFixed(2)}  v ${P[0].gs.toFixed(2)}  loco ${P[0].locoW.toFixed(2)} jog ${P[0].jogW.toFixed(2)} stride ${(P[0].stride || 0).toFixed(2)}`; }
function sheet(cols, rows, every, dt = 1 / 30) {
  const c = document.createElement("canvas"); c.width = W * cols; c.height = H * rows; const g = c.getContext("2d");
  for (let k = 0; k < cols * rows; k++) { for (let i = 0; i < every; i++) step(dt); render(); g.fillStyle = "#2a2f2d"; g.fillRect((k % cols) * W, Math.floor(k / cols) * H, W, H); g.drawImage(renderer.domElement, (k % cols) * W, Math.floor(k / cols) * H, W, H); g.fillStyle = "#ede7db"; g.font = "12px sans-serif"; g.fillText(T.toFixed(2), (k % cols) * W + 4, Math.floor(k / cols) * H + 14); }
  return c.toDataURL("image/png");
}
window.LAB = { P, step, render, sheet, advance(n, dt = 1 / 30) { for (let i = 0; i < n; i++) step(dt); render(); return T; }, cast };
if (q.get("auto") !== "0") { let last = performance.now(); (function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); render(); requestAnimationFrame(loop); })(last); }
else { step(0); render(); }
window.LAB_READY = true;
</script>
