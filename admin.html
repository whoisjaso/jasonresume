<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Dailies | jasonobawemimo.com</title>
<meta name="theme-color" content="#0a0d0b" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css?v=s1" />
<style>
  body { background: var(--lacquer); color: var(--ivory); font-family: var(--sans); font-size: var(--body); min-height: 100vh; }
  .dl { max-width: 1120px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 28px) 16px 80px; }
  @media (min-width: 760px) { .dl { padding-left: 32px; padding-right: 32px; } }
  .dl__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .dl__title { font-family: var(--serif); font-weight: 500; font-size: 40px; line-height: 1; letter-spacing: -0.01em; }
  .dl__meta { display: flex; gap: 8px; align-items: center; font-size: var(--small); color: var(--dim); }
  .dl__meta button { appearance: none; border: 1px solid var(--edge); background: var(--panel); color: var(--link); border-radius: 999px; padding: 7px 14px; font: 500 12px var(--sans); cursor: pointer; transition: transform .35s var(--spring); }
  .dl__meta button:active { transform: scale(.95); }
  .dl__head { margin: 28px 0 8px; font-family: var(--serif); font-size: clamp(28px, 4.4vw, 44px); line-height: 1.12; max-width: 30ch; }
  .dl__head b { font-weight: 500; color: var(--gold-2); font-variant-numeric: tabular-nums; }
  .dl__sub { color: var(--dim); font-size: var(--small); }

  .sec { margin-top: 36px; }
  .sec__h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 4px 10px; }
  .sec__h h2 { font: 600 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .sec__h small { font-size: 12px; color: var(--dim); }
  .split { display: grid; gap: 0 28px; }
  @media (min-width: 900px) { .split { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } }

  .group { list-style: none; margin: 0; padding: 0; }
  .p { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; opacity: 0; transform: translateY(8px); animation: in .6s var(--spring-soft) forwards; }
  @keyframes in { to { opacity: 1; transform: none; } }
  .ring { --v: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c, var(--gold)) calc(var(--v) * 1turn), var(--edge) 0); position: relative; }
  .ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--panel); }
  .ring b { position: relative; font: 600 13px var(--sans); font-variant-numeric: tabular-nums; }
  .ring.is-hot { --c: var(--gold-2); } .ring.is-warm { --c: var(--gold); } .ring.is-cold { --c: var(--edge-2); }
  .p__who { font-weight: 500; line-height: 1.35; }
  .p__story { margin-top: 3px; font-size: var(--small); color: var(--link); line-height: 1.4; }
  .p__tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font: 500 11px/1 var(--sans); padding: 5px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--edge); color: var(--link); }
  .tag--hot { background: var(--gold); border-color: var(--gold); color: var(--lacquer); }
  .tag--warm { border-color: var(--gold-ink); color: var(--gold-2); }
  .tag--ref { border-style: dashed; }
  .p__when { font-size: 12px; color: var(--dim); text-align: right; white-space: nowrap; }
  .hello { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; opacity: 0; transform: translateY(8px); animation: in .6s var(--spring-soft) forwards; }
  .hello__av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--edge); font: 500 20px var(--serif); color: var(--gold-2); }
  .hello__name { font-family: var(--serif); font-size: 22px; line-height: 1.1; }
  .hello__meta { margin-top: 3px; font-size: var(--small); color: var(--link); line-height: 1.4; }
  .hello__date { font-size: 12px; color: var(--dim); text-align: right; line-height: 1.5; }
  .hello__date b { display: block; color: var(--ivory); font-weight: 600; font-size: 13px; }

  .meter { padding: 6px 16px 14px; }
  .bar-row { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr) 3.2rem; gap: 12px; align-items: center; padding: 8px 0; font-size: var(--small); }
  .bar-row span:first-child { color: var(--link); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row i { display: block; height: 8px; border-radius: 4px; background: var(--gold); transform-origin: left; transform: scaleX(0); animation: grow .9s var(--spring-soft) forwards; }
  .bar-row i.is-dim { background: var(--edge-2); }
  @keyframes grow { to { transform: scaleX(var(--w)); } }
  .bar-row b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

  .funnel { padding: 14px 16px; }
  .funnel + .funnel { border-top: 1px solid var(--edge); }
  .funnel h3 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin-bottom: 8px; }
  .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .steps div { background: var(--panel-2); border-radius: 12px; padding: 10px; min-width: 0; position: relative; overflow: hidden; }
  .steps div::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--f) * 100%); background: var(--gold); }
  .steps b { display: block; font: 600 20px var(--sans); font-variant-numeric: tabular-nums; }
  .steps small { display: block; font-size: 11px; line-height: 1.25; color: var(--dim); }

  .q { padding: 13px 16px; font-size: 14px; line-height: 1.45; }
  .q small { display: block; margin-top: 3px; font-size: 12px; color: var(--dim); }
  .empty { padding: 16px; color: var(--dim); font-size: var(--small); }
  .foot { margin-top: 32px; font-size: 12px; color: var(--dim); line-height: 1.6; max-width: 60ch; }

  .gate { margin-top: 48px; max-width: 26rem; display: grid; gap: 14px; }
  .gate p { color: var(--link); }
  .gate form { display: flex; gap: 8px; }
  .gate input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--edge); border-radius: 999px; padding: 12px 18px; font: 15px var(--sans); color: var(--ivory); caret-color: var(--gold); }
  .gate input:focus { outline: none; border-color: var(--gold); }
  .gate__err { color: var(--gold-2); font-size: var(--small); min-height: 1.4em; }
  .setup code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--gold-2); }
  .setup li { padding: 12px 16px; }
  @media (prefers-reduced-motion: reduce) { .p, .bar-row i { animation: none; opacity: 1; transform: none; } .bar-row i { transform: scaleX(var(--w)); } }
</style>
</head>
<body>
<main class="dl">
  <header class="dl__top">
    <h1 class="dl__title">Dailies</h1>
    <div class="dl__meta"><span id="stamp"></span><button type="button" id="refresh">Refresh</button><button type="button" id="signout">Sign out</button></div>
  </header>
  <div id="view" aria-live="polite"></div>
</main>
<script>
(function () {
  "use strict";
  var view = document.getElementById("view"), stamp = document.getElementById("stamp");
  var TOKEN_KEY = "adm_token";
  var SECTION = { slate: "The Slate", desk: "The desk game", "desk-reveal": "The reveal", film: "The film", record: "The record", listen: "Obavia", questions: "Questions", rig: "The rig", move: "Next move", credits: "Check me", post: "The portrait", "b-slate": "Obavia, top", films: "Obavia films", book: "Obavia, booking" };
  function token() { try { return sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
  function setToken(t) { try { if (t) sessionStorage.setItem(TOKEN_KEY, t); else sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function ago(iso) {
    var t = new Date(iso), s = (Date.now() - t.getTime()) / 1000;
    if (isNaN(s)) return ""; if (s < 60) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago"; if (s < 86400 * 7) return Math.round(s / 86400) + " d ago";
    return t.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  function mins(s) { s = Math.round(Number(s) || 0); return s < 90 ? s + "s" : Math.round(s / 60) + "m"; }
  document.getElementById("signout").addEventListener("click", function () { setToken(""); gate(""); });
  document.getElementById("refresh").addEventListener("click", function () { load(true); });

  function gate(err) {
    stamp.textContent = "";
    view.innerHTML = '<div class="gate"><p>This board is for Jason. Paste the admin token to open it.</p><form><input type="password" autocomplete="current-password" placeholder="Admin token" aria-label="Admin token" /><button class="btn btn--gold" type="submit">Open</button></form><p class="gate__err">' + esc(err) + '</p></div>';
    var f = view.querySelector("form"), i = f.querySelector("input"); i.focus();
    f.addEventListener("submit", function (e) { e.preventDefault(); setToken(i.value.trim()); load(false); });
  }
  function setup(missing) {
    view.innerHTML = '<section class="sec setup"><div class="sec__h"><h2>Not wired yet</h2></div><p class="dl__sub" style="margin:0 4px 10px">Add these in Vercel, then redeploy. CONFIG.md has the steps.</p><ul class="group">' + missing.map(function (m) { return "<li><code>" + esc(m) + "</code></li>"; }).join("") + "</ul></section>";
  }

  function load(force) {
    var t = token(); if (!t) return gate("");
    view.innerHTML = '<p class="empty">Pulling the last thirty days.</p>';
    fetch("/api/metrics" + (force ? "?t=" + Date.now() : ""), { headers: { Authorization: "Bearer " + t } })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (x) {
        if (x.s === 401) { setToken(""); return gate("That token did not open it."); }
        if (x.s === 503) return setup(x.j.missing || ["ADMIN_TOKEN"]);
        if (x.s !== 200) { view.innerHTML = '<p class="empty">PostHog did not answer (' + esc(x.j.detail || x.s) + "). Try again in a minute.</p>"; return; }
        render(x.j);
      })
      .catch(function () { view.innerHTML = '<p class="empty">No connection. Try again.</p>'; });
  }

  function person(p, i) {
    var tier = (p.tier || "Cold").toLowerCase();
    var tags = '<span class="tag tag--' + tier + '">' + esc(p.tier) + "</span>" + '<span class="tag">' + esc(p.audience) + "</span>" + (p.visits > 1 ? '<span class="tag">' + plural(p.visits, "visit", "visits") + "</span>" : "") + (p.ref ? '<span class="tag tag--ref">' + esc(p.ref) + "</span>" : "");
    return '<li class="p" style="animation-delay:' + Math.min(i, 12) * 45 + 'ms"><span class="ring is-' + tier + '" style="--v:' + Math.min(1, p.score / 100) + '"><b>' + esc(p.score) + "</b></span>" +
      '<div><p class="p__who">' + esc(p.who) + '</p><p class="p__story">' + esc((p.story || []).join(", then ") || "looked around") + '</p><p class="p__tags">' + tags + "</p></div>" +
      '<span class="p__when">' + esc(ago(p.last)) + "</span></li>";
  }
  function bars(rows, label, value, fmt) {
    if (!rows || !rows.length) return '<p class="empty">Nothing yet.</p>';
    var max = Math.max.apply(null, rows.map(value)) || 1;
    return '<div class="meter">' + rows.map(function (r, i) {
      var v = value(r);
      return '<div class="bar-row"><span title="' + esc(label(r)) + '">' + esc(label(r)) + '</span><i class="' + (i ? "is-dim" : "") + '" style="--w:' + (v / max).toFixed(3) + ";animation-delay:" + i * 60 + 'ms"></i><b>' + esc(fmt ? fmt(v) : v) + "</b></div>";
    }).join("") + "</div>";
  }
  function funnel(j) {
    var s = [["arrived", "arrived"], ["played", "played"], ["checked", "checked"], ["reached_out", "reached out"]];
    var top = j.arrived || 1;
    return '<div class="funnel"><h3>' + esc(j.audience) + '</h3><div class="steps">' + s.map(function (k) { return '<div style="--f:' + ((j[k[0]] || 0) / top).toFixed(3) + '"><b>' + (j[k[0]] || 0) + "</b><small>" + k[1] + "</small></div>"; }).join("") + "</div></div>";
  }

  function when(iso) {
    var t = new Date(iso); if (isNaN(t)) return { d: "", h: "" };
    return { d: t.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }), h: t.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) };
  }
  function cap(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  function hello(p, i) {
    var w = when(p.named || p.first);
    return '<li class="hello" style="animation-delay:' + Math.min(i, 12) * 45 + 'ms"><span class="hello__av" aria-hidden="true">' + esc((p.name || "?").charAt(0).toUpperCase()) + "</span>" +
      '<div><p class="hello__name">' + esc(p.name) + '</p><p class="hello__meta">' + esc(p.audience) + (p.place ? ", " + esc(p.place) : "") + (p.visits > 1 ? ". " + plural(p.visits, "visit", "visits") : "") + ". " + esc(cap((p.story || []).join(", then ") || "looked around")) + '</p></div>' +
      '<p class="hello__date"><b>' + esc(w.d) + "</b>" + esc(w.h) + (p.last && p.last !== p.named ? "<br>last seen " + esc(ago(p.last)) : "") + "</p></li>";
  }
  function render(d) {
    var h = d.headline || {};
    stamp.textContent = "as of " + ago(d.at);
    var head = "This week, <b>" + plural(h.week || 0, "person", "people") + "</b> came. <b>" + (h.worth || 0) + "</b> " + ((h.worth === 1) ? "is" : "are") + " worth a look" + (h.outreach ? ", and <b>" + h.outreach + "</b> came from your outreach." : ".") + (h.named ? " <b>" + h.named + "</b> told you their name." : "");
    var worth = d.worth || [];
    var html = '<p class="dl__head">' + head + '</p><p class="dl__sub">' + plural(h.month || 0, "visitor", "visitors") + " in the last thirty days. Hot means they reached out or scored 40 and up; warm is 15 and up. Scores fade by half every two weeks.</p>";
    var named = d.named || [];
    html += '<section class="sec"><div class="sec__h"><h2>Who said hello</h2><small>' + named.length + " named, last thirty days</small></div>" + (named.length ? '<ul class="group">' + named.map(hello).join("") + "</ul>" : '<ul class="group"><li class="empty">No names yet. Anyone who types a name at the start of the intro shows up here.</li></ul>') + "</section>";
    html += '<div class="split"><section class="sec"><div class="sec__h"><h2>Worth a look</h2><small>' + worth.length + "</small></div>" + (worth.length ? '<ul class="group">' + worth.map(person).join("") + "</ul>" : '<ul class="group"><li class="empty">No one warm yet. The desk and the resume are where it starts.</li></ul>') + "</section>";
    html += '<div><section class="sec"><div class="sec__h"><h2>Journeys</h2></div><div class="group">' + (d.journeys || []).map(funnel).join("") + "</div></section>";
    html += '<section class="sec"><div class="sec__h"><h2>Where they came from</h2></div><div class="group">' + bars(d.sources, function (r) { return r.source; }, function (r) { return r.people; }) + "</div></section></div></div>";
    html += '<div class="split"><section class="sec"><div class="sec__h"><h2>Where attention went</h2><small>seconds on screen</small></div><div class="group">' + bars((d.attention || []).slice(0, 12), function (r) { return SECTION[r.section] || r.section; }, function (r) { return r.seconds; }, mins) + "</div></section>";
    html += '<div><section class="sec"><div class="sec__h"><h2>Questions they asked</h2></div><ul class="group">' + ((d.questions || []).length ? d.questions.map(function (q) { return '<li class="q">' + esc(q.q) + "<small>" + esc(ago(q.at)) + "</small></li>"; }).join("") : '<li class="empty">No questions yet.</li>') + "</ul></section>";
    html += "</div></div>";
    var dr = d.drops || { count: 0, names: {} }, names = Object.keys(dr.names || {});
    html += '<p class="foot">' + (dr.count ? "The relay turned away " + plural(dr.count, "event", "events") + (names.length ? " (" + esc(names.slice(0, 6).join(", ")) + ")" : "") + ". Add their names to the allowlist in api/track.js if they matter. " : "") + "Visitors with Do Not Track or Global Privacy Control on are never counted. Names come only from people who type one at the start of the intro or send a form.</p>";
    view.innerHTML = html;
  }

  load(false);
})();
</script>
</body>
</html>
