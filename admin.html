<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Admin | jasonobawemimo.com</title>
<meta name="theme-color" content="#0a0d0b" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="site.css" />
<style>
  body { min-height: 100vh; }
  .adm { position: relative; z-index: 2; max-width: 1180px; margin: 0 auto; padding: clamp(28px, 5vh, 56px) var(--pad) 80px; }
  .adm__head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 14px 24px; padding-bottom: 22px; border-bottom: 1px solid var(--gold-line-2); }
  .adm__head h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1; }
  .adm__head h1 em { font-style: italic; color: var(--gold); }
  .adm__meta { display: flex; align-items: center; gap: 18px; font-size: 12.5px; color: var(--ivory-3); }
  .adm__meta button { appearance: none; background: none; border: 0; border-bottom: 1px solid var(--line-3); padding: 0 0 2px; color: var(--ivory-2); cursor: pointer; font-size: 12.5px; }
  .adm__meta button:hover { color: var(--gold-2); border-color: var(--gold); }

  /* gate and setup */
  .adm__gate { display: grid; gap: 18px; max-width: 30rem; margin-top: 40px; }
  .adm__gate p { color: var(--ivory-2); }
  .adm__gate form { display: flex; gap: 10px; }
  .adm__gate input { flex: 1; background: rgba(10,13,11,0.6); border: 1px solid var(--line); border-radius: 999px; padding: 11px 18px; font-size: 14.5px; color: var(--ivory); caret-color: var(--gold); }
  .adm__gate input:focus { outline: none; border-color: var(--gold); }
  .adm__err { color: var(--gold-2); font-size: 13px; min-height: 1.4em; }
  .adm__setup { margin-top: 40px; max-width: 48rem; display: grid; gap: 14px; }
  .adm__setup code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--gold-2); }
  .adm__setup li { padding: 8px 0; border-bottom: 1px solid var(--line-2); color: var(--ivory-2); }

  /* the board */
  .board { display: grid; gap: clamp(28px, 4vh, 44px); margin-top: clamp(28px, 4vh, 40px); }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line-2); }
  .tile { padding: 26px 0 22px; border-bottom: 1px solid var(--line-2); }
  .tile + .tile { padding-left: 28px; border-left: 1px solid var(--line-2); }
  .tile .label { color: var(--ivory-3); }
  .tile b { display: block; margin-top: 10px; font-family: var(--serif); font-weight: 500; font-size: clamp(2.6rem, 6vw, 4.2rem); line-height: 1; color: var(--ivory); font-variant-numeric: tabular-nums; }
  .tile small { display: block; margin-top: 8px; font-size: 12.5px; color: var(--ivory-3); }
  .tile.is-hero b { color: var(--gold); }

  .panel { display: grid; gap: 16px; }
  .panel h2 { font-family: var(--serif); font-weight: 500; font-size: 1.45rem; line-height: 1.1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .panel h2 small { font-family: var(--sans); font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ivory-3); font-weight: 500; }
  .two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(28px, 4vw, 56px); align-items: start; }

  .chart { position: relative; width: 100%; aspect-ratio: 16 / 6; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chart .grid line { stroke: var(--line-2); stroke-width: 1; }
  .chart .axis text { fill: var(--ivory-3); font-family: var(--sans); font-size: 11px; }
  .chart .line { fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chart .area { fill: url(#areaFill); opacity: 0; transition: opacity 0.9s ease 0.9s; }
  .chart.is-in .area { opacity: 1; }
  .chart .dot { fill: var(--lacquer); stroke: var(--gold); stroke-width: 2; r: 4; opacity: 0; transition: opacity 0.3s ease; }
  .chart .dot.is-on { opacity: 1; }
  .chart .hair { stroke: var(--gold-line); stroke-width: 1; opacity: 0; }
  .chart .hair.is-on { opacity: 1; }
  .tip { position: absolute; pointer-events: none; transform: translate(-50%, -100%); background: var(--panel-2); border: 1px solid var(--gold-line-2); padding: 8px 12px; font-size: 12.5px; color: var(--ivory); white-space: nowrap; opacity: 0; transition: opacity 0.2s ease; }
  .tip.is-on { opacity: 1; }
  .tip b { color: var(--gold-2); font-weight: 600; }
  .empty { padding: 26px 0; font-size: 14px; color: var(--ivory-3); font-style: italic; }

  .bars { display: grid; gap: 12px; }
  .bar { display: grid; grid-template-columns: minmax(150px, 0.48fr) minmax(0, 1fr) 44px; align-items: center; gap: 14px; font-size: 14px; }
  .bar span:first-child { color: var(--ivory-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar i { display: block; height: 10px; background: var(--gold); border-radius: 0 4px 4px 0; transform-origin: 0 50%; transform: scaleX(0); transition: transform 1.1s var(--ease); }
  .bar i.is-in { transform: scaleX(var(--w)); }
  .bar em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--ivory); text-align: right; }
  .bars--soft .bar i { background: var(--gold-3); }

  .people { display: grid; }
  .person { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr) minmax(0, 1fr) auto; gap: 14px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line-2); font-size: 14px; }
  .person b { font-family: var(--serif); font-weight: 500; font-size: 1.15rem; color: var(--ivory); }
  .person span { color: var(--ivory-2); }
  .person small { color: var(--ivory-3); font-size: 12.5px; }
  .person time { color: var(--ivory-3); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .asked { display: grid; }
  .asked li { padding: 10px 0; border-bottom: 1px solid var(--line-2); font-family: var(--serif); font-size: 1.1rem; line-height: 1.3; color: var(--ivory-2); display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  .asked li small { font-family: var(--sans); font-size: 12px; color: var(--ivory-3); white-space: nowrap; }

  @media (max-width: 860px) {
    .two { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: 1fr; }
    .tile + .tile { padding-left: 0; border-left: 0; }
    .person { grid-template-columns: 1fr auto; }
    .person small:nth-child(3) { grid-column: 1 / -1; }
    .chart { aspect-ratio: 16 / 9; }
  }
  @media (max-width: 560px) {
    .bar { grid-template-columns: minmax(0, 1fr) 44px; row-gap: 6px; }
    .bar span:first-child { grid-column: 1 / -1; white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { .bar i, .chart .line, .chart .area { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<main class="adm">
  <header class="adm__head">
    <h1>Who came, and <em>why</em>.</h1>
    <div class="adm__meta"><span id="stamp">jasonobawemimo.com, last 30 days</span><button type="button" id="refresh">Refresh</button><button type="button" id="signout">Sign out</button></div>
  </header>
  <div id="view"></div>
</main>
<script>
(function () {
  "use strict";
  var view = document.getElementById("view"), stamp = document.getElementById("stamp");
  var TOKEN_KEY = "adm_token";
  function token() { try { return sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
  function setToken(t) { try { if (t) sessionStorage.setItem(TOKEN_KEY, t); else sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function n(v) { v = Number(v) || 0; return v.toLocaleString("en-US"); }
  function ago(iso) {
    var t = new Date(iso), s = (Date.now() - t.getTime()) / 1000;
    if (isNaN(s)) return ""; if (s < 60) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago"; if (s < 86400 * 7) return Math.round(s / 86400) + " d ago";
    return t.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  document.getElementById("signout").addEventListener("click", function () { setToken(""); gate(""); });
  document.getElementById("refresh").addEventListener("click", function () { load(true); });

  function gate(err) {
    view.innerHTML = '<div class="adm__gate"><p>This page is for Jason. Paste the admin token to open it.</p><form><input type="password" autocomplete="current-password" placeholder="Admin token" aria-label="Admin token" /><button class="btn btn--solid" type="submit"><span>Open</span></button></form><p class="adm__err">' + esc(err) + '</p></div>';
    var f = view.querySelector("form"), i = f.querySelector("input"); i.focus();
    f.addEventListener("submit", function (e) { e.preventDefault(); setToken(i.value.trim()); load(false); });
  }
  function setup(missing) {
    view.innerHTML = '<div class="adm__setup"><p>The board is wired but the project is missing configuration. Add these in Vercel and redeploy:</p><ul>' + missing.map(function (m) { return "<li><code>" + esc(m) + "</code></li>"; }).join("") + '</ul><p>Details are in <code>CONFIG.md</code> in the repository.</p></div>';
  }

  function load(force) {
    var t = token(); if (!t) return gate("");
    view.innerHTML = '<p class="empty">Loading.</p>';
    fetch("/api/metrics" + (force ? "?t=" + Date.now() : ""), { headers: { Authorization: "Bearer " + t } })
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (x) {
        if (x.s === 401) { setToken(""); return gate("That token did not open it."); }
        if (x.s === 503) return setup(x.j.missing || ["ADMIN_TOKEN"]);
        if (x.s !== 200) { view.innerHTML = '<p class="empty">PostHog did not answer (' + esc(x.j.detail || x.s) + '). Try again in a minute.</p>'; return; }
        render(x.j);
      })
      .catch(function () { view.innerHTML = '<p class="empty">No connection.</p>'; });
  }

  function rows(list) { return Array.isArray(list) ? list : []; }

  function render(d) {
    stamp.textContent = "jasonobawemimo.com, last 30 days, refreshed " + new Date(d.at).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    var tot = rows(d.totals)[0] || {}, roles = rows(d.roles), funnel = {}, people = rows(d.people), refs = rows(d.refs), devices = rows(d.devices), asked = rows(d.questions), pains = rows(d.intents);
    rows(d.funnel).forEach(function (r) { funnel[r.event] = Number(r.v) || 0; });
    var named = funnel.name_given || 0, chose = funnel.role_chosen || 0;
    var F = [["Arrived", funnel.site_arrived || 0], ["Chose a path", chose], ["Gave a name", named], ["Finished the tour", funnel.guide_finished || 0], ["Asked Jason something", funnel.chat_asked || 0], ["Sent the intake", funnel.intake_sent || 0], ["Clicked resume or email", funnel.cta_click || 0]];
    var PAIN = { found: "Nobody finds us", convert: "Traffic never becomes a lead", paper: "Paperwork and compliance", followup: "Follow-up after first contact", tribal: "It lives in my head" };

    view.innerHTML =
      '<div class="board">' +
        '<div class="tiles">' +
          tile("Today", tot.today, "unique visitors", true) + tile("This week", tot.week, "unique visitors") + tile("This month", tot.month, "unique visitors") +
        '</div>' +
        '<section class="panel"><h2>Visitors by day<small>30 days</small></h2><div class="chart" id="chart"></div></section>' +
        '<div class="two">' +
          '<section class="panel"><h2>Who they said they were<small>' + n(chose) + ' chose</small></h2>' + bars(roles.map(function (r) { return [labelRole(r.r), r.v]; }), chose) + '</section>' +
          '<section class="panel"><h2>How far they went<small>of ' + n(F[0][1]) + '</small></h2>' + bars(F, F[0][1], true) + '</section>' +
        '</div>' +
        '<section class="panel"><h2>By name<small>' + n(named) + ' told Jason their name</small></h2>' +
          (people.length ? '<div class="people">' + people.map(function (p) { return '<div class="person"><b>' + esc(p.name) + '</b><span>' + esc(labelRole(p.role)) + '</span><small>' + esc([p.city, p.region || p.country].filter(Boolean).join(", ") || "location unknown") + (p.device ? " · " + esc(p.device) : "") + (p.ref ? " · from " + esc(p.ref) : "") + '</small><time>' + esc(ago(p.at)) + '</time></div>'; }).join("") + '</div>' : '<p class="empty">Nobody has typed a name yet.</p>') +
        '</section>' +
        '<div class="two">' +
          '<section class="panel"><h2>What they asked<small>live chat</small></h2>' + (asked.length ? '<ul class="asked">' + asked.map(function (q) { return "<li><span>" + esc(q.q) + "</span><small>" + esc(labelRole(q.role)) + ", " + esc(ago(q.at)) + "</small></li>"; }).join("") + "</ul>" : '<p class="empty">No questions yet.</p>') + '</section>' +
          '<section class="panel"><h2>Where it hurts<small>intake, first tap</small></h2>' + bars(pains.map(function (p) { return [PAIN[p.pain] || p.pain || "unspecified", p.v]; }), null) +
            '<h2 style="margin-top:14px">Where they came from<small>referrers</small></h2>' + bars(refs.map(function (r) { return [r.r, r.v]; }), null) +
            '<h2 style="margin-top:14px">Devices</h2>' + bars(devices.map(function (r) { return [r.d, r.v]; }), null) + '</section>' +
        '</div>' +
      '</div>';

    drawChart(document.getElementById("chart"), rows(d.days));
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      view.querySelectorAll(".bar i").forEach(function (b, i) { setTimeout(function () { b.classList.add("is-in"); }, 80 + i * 45); });
      view.querySelectorAll(".tile b").forEach(countUp);
    }); });
  }
  function labelRole(r) { return { interviewer: "Interviewer", partner: "Business partner", lurker: "Lurking", skipped: "Skipped the question" }[r] || (r || "unknown"); }
  function tile(k, v, sub, hero) { return '<div class="tile' + (hero ? " is-hero" : "") + '"><span class="label">' + k + '</span><b data-n="' + (Number(v) || 0) + '">0</b><small>' + sub + '</small></div>'; }
  function bars(list, total, soft) {
    if (!list.length) return '<p class="empty">Nothing yet.</p>';
    var max = total || Math.max.apply(null, list.map(function (r) { return Number(r[1]) || 0; })) || 1;
    return '<div class="bars' + (soft ? " bars--soft" : "") + '">' + list.map(function (r) { var v = Number(r[1]) || 0; return '<div class="bar"><span>' + esc(r[0]) + '</span><i style="--w:' + Math.max(0.01, v / max).toFixed(3) + '"></i><em>' + n(v) + '</em></div>'; }).join("") + '</div>';
  }
  function countUp(el) {
    var target = Number(el.dataset.n) || 0, t0 = performance.now(), dur = 900;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = n(target); return; }
    (function step(now) { var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = n(Math.round(target * e)); if (p < 1) requestAnimationFrame(step); })(t0);
  }

  function drawChart(host, days) {
    if (!host) return;
    var map = {}, list = [], today = new Date(); today.setHours(0, 0, 0, 0);
    days.forEach(function (r) { map[String(r.d).slice(0, 10)] = Number(r.v) || 0; });
    for (var i = 29; i >= 0; i--) { var dt = new Date(today.getTime() - i * 86400000), key = dt.toISOString().slice(0, 10); list.push({ d: dt, key: key, v: map[key] || 0 }); }
    var W = 960, H = 360, L = 34, R = 12, T = 18, B = 34, w = W - L - R, h = H - T - B;
    var max = Math.max(4, Math.max.apply(null, list.map(function (p) { return p.v; })));
    var X = function (i) { return L + (i / (list.length - 1)) * w; }, Y = function (v) { return T + h - (v / max) * h; };
    var pts = list.map(function (p, i) { return [X(i), Y(p.v)]; });
    var path = pts.map(function (p, i) { if (!i) return "M" + p[0] + " " + p[1]; var a = pts[i - 1], cx = (a[0] + p[0]) / 2; return "C" + cx + " " + a[1] + " " + cx + " " + p[1] + " " + p[0] + " " + p[1]; }).join(" ");
    var area = path + " L" + pts[pts.length - 1][0] + " " + (T + h) + " L" + pts[0][0] + " " + (T + h) + " Z";
    var ticks = [0, Math.round(max / 2), max], svg = '';
    svg += '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Unique visitors per day, last 30 days">';
    svg += '<defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a642" stop-opacity="0.22"/><stop offset="1" stop-color="#c9a642" stop-opacity="0"/></linearGradient></defs>';
    svg += '<g class="grid">' + ticks.map(function (t) { return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/>'; }).join("") + '</g>';
    svg += '<g class="axis">' + ticks.map(function (t) { return '<text x="' + (L - 8) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + t + '</text>'; }).join("");
    [0, 7, 14, 21, 29].forEach(function (i) { svg += '<text x="' + X(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + list[i].d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + '</text>'; });
    svg += '</g><path class="area" d="' + area + '"/><path class="line" d="' + path + '"/><line class="hair" y1="' + T + '" y2="' + (T + h) + '"/><circle class="dot" r="4"/></svg><div class="tip"></div>';
    host.innerHTML = svg;
    var line = host.querySelector(".line"), len = line.getTotalLength();
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
      requestAnimationFrame(function () { line.style.transition = "stroke-dashoffset 1.6s cubic-bezier(0.65,0,0.35,1)"; line.style.strokeDashoffset = 0; });
    }
    setTimeout(function () { host.classList.add("is-in"); }, 50);
    var hair = host.querySelector(".hair"), dot = host.querySelector(".dot"), tip = host.querySelector(".tip"), svgEl = host.querySelector("svg");
    function on(e) {
      var r = svgEl.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, i = Math.round(((x - L) / w) * (list.length - 1)); i = Math.max(0, Math.min(list.length - 1, i));
      var p = pts[i]; hair.setAttribute("x1", p[0]); hair.setAttribute("x2", p[0]); dot.setAttribute("cx", p[0]); dot.setAttribute("cy", p[1]);
      hair.classList.add("is-on"); dot.classList.add("is-on"); tip.classList.add("is-on");
      tip.innerHTML = "<b>" + n(list[i].v) + "</b> " + (list[i].v === 1 ? "visitor" : "visitors") + " · " + list[i].d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
      tip.style.left = (p[0] / W * 100) + "%"; tip.style.top = (p[1] / H * 100 - 4) + "%";
    }
    function off() { hair.classList.remove("is-on"); dot.classList.remove("is-on"); tip.classList.remove("is-on"); }
    svgEl.addEventListener("pointermove", on); svgEl.addEventListener("pointerleave", off);
  }

  load(false);
  setInterval(function () { if (token() && !document.hidden) load(true); }, 60000);
})();
</script>
</body>
</html>
